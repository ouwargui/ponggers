name: Deploy signaling Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-worker.yml
      - apps/signaling/**
      - packages/signaling-protocol/**
      - bun.lock
      - package.json

permissions:
  contents: read

concurrency:
  group: deploy-signaling-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun canary
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test signaling packages
        run: bun test apps/signaling packages/signaling-protocol

      - name: Typecheck signaling Worker
        run: bun --filter @ponggers/signaling typecheck

      - name: Deploy signaling Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/signaling
          packageManager: bun
          wranglerVersion: 4.111.0
          command: deploy
          secrets: |
            TURN_KEY_ID
            TURN_KEY_API_TOKEN
        env:
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
