name: Build and submit mobile app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-mobile.yml
      - apps/mobile/**
      - packages/signaling-protocol/**
      - bun.lock
      - package.json

permissions:
  contents: read

concurrency:
  group: release-mobile-production
  cancel-in-progress: false

jobs:
  release-ios:
    name: Verify, build, and submit iOS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Bun canary
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 21.0.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Typecheck workspaces
        run: bun run typecheck

      - name: Build and submit to TestFlight
        working-directory: apps/mobile
        run: >-
          eas build
          --platform ios
          --profile production
          --auto-submit
          --non-interactive
          --no-wait
